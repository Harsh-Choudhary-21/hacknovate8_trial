<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Analog Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0a0a0c;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .clock-container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(20, 20, 25, 0.8) 0%, rgba(10, 10, 12, 0.95) 100%);
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(255, 255, 255, 0.05),
                0 0 40px rgba(99, 102, 241, 0.05);
            z-index: 1;
        }

        .clock-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 50%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .center-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border: 2px solid rgba(99, 102, 241, 0.8);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.6);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            will-change: transform;
        }

        .hour-hand {
            width: 6px;
            height: 110px;
            margin-left: -3px;
            background: linear-gradient(to top, #ffffff, #e0e0e0);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .minute-hand {
            width: 4px;
            height: 155px;
            margin-left: -2px;
            background: linear-gradient(to top, #ffffff, #dcdde1);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .ticks-container {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            pointer-events: none;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.15);
            left: 50%;
            margin-left: -1px;
            transform-origin: 50% 200px;
        }

        .tick-letter {
            position: absolute;
            color: #ffffff;
            font-size: 35px;
            font-weight: 600;
            text-align: center;
            width: 60px;
            height: 40px;
            line-height: 40px;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.9);
            transition: opacity 0.25s ease, transform 0.25s ease, text-shadow 0.25s ease, color 0.25s ease;
        }

        @keyframes rainbow {
            0% {
                color: #ff4757;
                text-shadow: 0 0 12px rgba(255, 71, 87, 0.8), 0 0 25px rgba(255, 71, 87, 0.4);
            }
            17% {
                color: #ffa502;
                text-shadow: 0 0 12px rgba(255, 165, 2, 0.8), 0 0 25px rgba(255, 165, 2, 0.4);
            }
            33% {
                color: #2ed573;
                text-shadow: 0 0 12px rgba(46, 213, 115, 0.8), 0 0 25px rgba(46, 213, 115, 0.4);
            }
            50% {
                color: #1e90ff;
                text-shadow: 0 0 12px rgba(30, 144, 255, 0.8), 0 0 25px rgba(30, 144, 255, 0.4);
            }
            67% {
                color: #ff5252;
                text-shadow: 0 0 12px rgba(255, 82, 82, 0.8), 0 0 25px rgba(255, 82, 82, 0.4);
            }
            83% {
                color: #e056fd;
                text-shadow: 0 0 12px rgba(224, 86, 253, 0.8), 0 0 25px rgba(224, 86, 253, 0.4);
            }
            100% {
                color: #ff4757;
                text-shadow: 0 0 12px rgba(255, 71, 87, 0.8), 0 0 25px rgba(255, 71, 87, 0.4);
            }
        }

        .tick-letter.revealed {
            opacity: 1;
            animation: rainbow 6s linear infinite;
            transform: translate(-50%, -50%) scale(1.15);
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div class="clock-container" id="clock">
        <div class="ticks-container" id="ticksContainer"></div>
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="center-dot"></div>
    </div>
    <script src="clock.js"></script>
</body>

</html>
